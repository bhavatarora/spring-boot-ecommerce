<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Checkout - Enter Address - ShopHub</title>
    <base href="/">
    <link href="css/bootstrap.css" rel="stylesheet">
    <link href="font-awesome/css1/all.css" rel="stylesheet">
    <link href="images/icon.png" rel="icon"/>
    <link href="css/style4.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3>Enter Shipping Address</h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/checkout/add-address}" th:object="${address}" method="post">
                        <div class="form-group mb-3">
                            <label for="street">Street Address *</label>
                            <input type="text" class="form-control" id="street" th:field="*{street}" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('street')}" th:errors="*{street}"></div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="city">City *</label>
                                    <input type="text" class="form-control" id="city" th:field="*{city}" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="state">State *</label>
                                    <input type="text" class="form-control" id="state" th:field="*{state}" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('state')}" th:errors="*{state}"></div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="zip">Zip Code *</label>
                                    <input type="text" class="form-control" id="zip" th:field="*{zip}" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('zip')}" th:errors="*{zip}"></div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label for="country">Country *</label>
                                    <input type="text" class="form-control" id="country" th:field="*{country}" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('country')}" th:errors="*{country}"></div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mt-4">
                            <button type="submit" class="btn btn-primary">Save & Continue</button>
                            <a href="/shoppingCart" class="btn btn-secondary">Back to Cart</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
