<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>My Orders - ShopHub</title>
    <base href="/">
    <link href="css/bootstrap.css" rel="stylesheet">
    <link href="font-awesome/css1/all.css" rel="stylesheet">
    <link href="images/icon.png" rel="icon"/>
    <link href="css/style4.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header">
                    <h3><i class="fas fa-shopping-bag"></i> My Orders</h3>
                </div>
                <div class="card-body">
                    <div th:if="${orders.isEmpty()}" class="alert alert-info">
                        <p>You haven't placed any orders yet.</p>
                        <a href="/" class="btn btn-primary">Start Shopping</a>
                    </div>
                    
                    <table th:if="${!orders.isEmpty()}" class="table table-hover">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th>Total Amount</th>
                                <th>Items</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="order : ${orders}">
                                <td th:text="${order.id}"></td>
                                <td th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy')}"></td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${order.status.name() == 'PENDING' ? 'bg-warning' : 
                                                          (order.status.name() == 'SHIPPED' ? 'bg-info' : 
                                                          (order.status.name() == 'DELIVERED' ? 'bg-success' : 'bg-danger'))}"
                                          th:text="${order.status}">
                                    </span>
                                </td>
                                <td th:text="'$' + ${order.totalAmount}"></td>
                                <td th:text="${order.items.size()} + ' item(s)'"></td>
                                <td>
                                    <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-sm btn-primary">
                                        <i class="fas fa-eye"></i> View Details
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    
                    <div class="mt-3">
                        <a href="/" class="btn btn-secondary">Back to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
